name: terraguard_mobile
description: TerraGuard offline-first field reporting companion for LandslideGuard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.0
  geolocator: ^13.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  path: ^1.9.0
  permission_handler: ^11.3.0
  sqflite: ^2.3.3+1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
